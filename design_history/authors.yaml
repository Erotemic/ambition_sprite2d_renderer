    paths: [assets/mary_o_v2.svg]
    who: Jon Crall (drawn by hand)
    note: "Jon, 2026-10-25: he drew most of Mary-O v2. The commit (a Claude Opus 5 session) says it carries Jon's art pass."
  - commit: 36fb44d79da39e29ab4245f4058e779718fb8c4f
    paths: [assets/noether.svg]
    who: Jon Crall (drawn by hand)
    note: "The commit, from Jon's account, says: hand traced noether svg with part labels."
