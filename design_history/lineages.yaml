        label: "Round pelican, red bicycle"
        note: "Glasses, a deep pouch, a track stand at rest; the W bag kept. Jon: a revised sprite, a pelican on a bicycle, keep the bag with a W. Claude Opus 5.5 declared."
  girdle:
    name: Girdle
    ids: [girdle]
    paths: ['girdle', '_person_rig']
    summary: "a first design, then a person of the shared rig: a cream suit and round glasses, his hands behind his back; he reads as Kurt Goedel"
    eras:
      - commit: "aaa2d8a"
        label: "The first design"
        note: "The last commit with the first design. The commit that introduced it is not surveyed."
      - commit: "d37754c"
        label: "A person of the shared rig"
        note: "A cream suit and round glasses, his hands behind his back; he reads as Kurt Goedel. Jon asked for new art for the scientists and mathematicians. Claude Opus 5.5 declared."
  neil_ongras_turfson:
    name: Neil Ongras Turfson
