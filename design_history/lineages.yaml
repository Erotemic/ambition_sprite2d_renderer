    name: Burning flying shark
    ids: [burning_flying_shark]
    paths: ['shark']
    summary: "a grey shark with a fire fin to a fire-wreathed SVG-rigged one"
    tile_w: 300
    per_row: 4
    eras:
      - commit: "62886ed06"
        label: "First shark"
      - commit: "61f536265"
        label: "Procedural, no backdrop"
      - commit: "acf4f69d2"
        label: "SVG-rigged, fire-wreathed"
        note: "Polished (Oct 5). Current design."
  treasure_chest:
    # Before October 2026 the chest was one texture of the batched `entities`
    # target (`chest_closed`); `boss_chest` and `treasure_chest` came later. The
    # survey found one drawn look of the dedicated target.
    name: Treasure chest
    ids: [entities]
    paths: ['chest', 'props/entities']
    pick: 'file:chest_closed.png'
    summary: "one chest drawn once, as a boss (big-item) chest"
    eras:
      - commit: "a9a563809"
        id: boss_chest
        pick: null
        label: "The boss (big-item) chest"
        note: "Royal blue and gold with a heavy lock; the first dedicated chest target. Claude Opus 5.5 declared."
  boss_chest:
    name: Boss (big-item) chest
    ids: [boss_chest]
    paths: ['chest']
  oiler:
    name: Oiler
    ids: [oiler]
    paths: ['oiler']
    summary: "several different Oilers before the multiview SVG rig"
    eras:
      - commit: "0cce56e13"
        label: "Goggles and wrench"
        note: "The first Oiler, committed as plain 'sprites' from Jon's account."
      - commit: "13a143098"
        label: "Toon preset"
        note: "A very different drawing under the same id: hat and cardboard body. Not verified whether this was meant as the same character."
      - commit: "5056024a1"
        label: "Editable multiview SVG rig"
        note: "Rebuilt around a multiview SVG rig."
      - commit: "3f7d265b0"
        label: "A body that can throw a punch"
        note: "Same face; the body gained moves. A session list carries a synthetic entry."
  giant_gnu:
    name: Giant GNU (GNU-ton's mount)
    ids: [gnu_ton_boss]
    paths: ['gnu_ton_boss']
    summary: "from a wildebeest of flat polygons to a giant that is almost a centaur"
    eras:
      - commit: "a18c282"
        label: "A wildebeest of polygons, with a spiked hump"
        note: "The last commit with the first design. Its face was liked: goofy, and not on purpose."
      - commit: "a6e2ab1"
        label: "A giant like a gnu, almost a centaur"
        note: "Jon chose it in rounds of stills: a mythical giant, a slope for a back, a gnu's horns, a plain face. Claude Opus 5.5 declared."
  pirate_raider:
    name: Pirate crew (the raider stands for the five)
    ids: [pirate_raider]
    paths: ['_pirate_common', '_pirate_rig', 'pirate_raider']
    summary: "five pirates on one thin body, then five characters"
    eras:
      - commit: "3b3209c"
        label: "One thin body in five palettes"
        note: "The last commit with the first design. The commit that introduced it is not surveyed."
      - commit: "333e716"
        label: "Five characters"
        note: "Full bodies, a look for each pirate, the head on the chest, each pose made again. Jon: redo them completely, the posing too. Claude Opus 5.5 declared."
  imperfect_cellular_automaton:
    name: Imperfect Cellular Automaton
    ids: [imperfect_cellular_automaton]
    paths: ['imperfect_cellular_automaton']
    summary: "a boxy robot in two halves, then a hunched creature with a tail in the same two halves"
    eras:
      - commit: "039a376"
        label: "Boxy robot, half green and half purple"
        note: "The last commit with the first design: a procedural skeleton with 4 rows. The commit that introduced it is not surveyed."
      - commit: "e0891f4"
        label: "Hunched, tailed, drawn from both sides"
        note: "An SVG rig on the perfect one's clips. Jon chose candidate F of two rounds of stills: keep the two halves, an overt reference to Imperfect Cell that is not a copy. Claude Opus 5.5 declared."
  pirate_heavy:
    name: Pirate heavies (Iron Mary, Broadside Bess, Salt Annet)
    ids: [pirate_heavy]
    paths: ['pirate_heavy', '_pirate_heavy_rig']
    summary: "one body in three palettes, then three women from one template"
    eras:
      - commit: "943fa10"
        label: "One body in three palettes"
        note: "The last commit with the first design: stick arms, a cleaver that floats behind the body. Jon: not very good, but it has something. The commit that introduced it is not surveyed."
      - commit: "35b6aee"
        label: "Three women from one template"
        note: "A build, a head, a mark and a blade for each; arms on a skeleton; a chop with a windup and a step. Jon: a heavy woman, a round face, fierce eyes, a bandana over a head of hair. Claude Opus 5.5 declared."
  ai_slop:
    name: AI Slop
    ids: [ai_slop]
    paths: ['ai_era_enemies', 'ai_slop']
    summary: "a purple collage of thumbnail cards with two long arms, then a heap of gradient goo"
    eras:
      - commit: "11133ff"
        label: "Thumbnail-collage sludge beast"
        note: "The last commit with the first design. The commit that introduced it is not surveyed."
      - commit: "77f2432"
        label: "A heap of gradient goo"
        note: "Mismatched eyes, a third eye, too many teeth, a hand with seven fingers, a stock picture, sparkles. Jon: rework the art. Claude Opus 5.5 declared."
  synthetic_friend:
