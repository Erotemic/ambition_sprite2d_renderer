    paths: ['neil_ongras_turfson', '_person_rig']
    summary: "a first design, then a person of the shared rig: tall and upright with a moustache and a star waistcoat"
    eras:
      - commit: "aaa2d8a"
        label: "The first design"
        note: "The last commit with the first design. The commit that introduced it is not surveyed."
      - commit: "d37754c"
        label: "A person of the shared rig"
        note: "Tall and upright with a moustache and a star waistcoat. Jon: he should stand up straight and be very slightly more portly. Jon asked for new art for the scientists and mathematicians. Claude Opus 5.5 declared."
  m_leblanc:
    name: M. LeBlanc
