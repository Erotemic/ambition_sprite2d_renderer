      - commit: "121f793"
        label: "Aubergine coat and a stole"
        note: "The last commit with the first design. The commit that introduced it is not surveyed."
      - commit: "7ce2ed4"
        label: "The dreamer with the noodle scarf"
        note: "Three quarters view, large eyes, a night-blue coat with a constellation, a scarf that trails; chalk-gold mathematics. Jon: redesign the Ramen-Nujan character. Claude Opus 5.5 declared."
