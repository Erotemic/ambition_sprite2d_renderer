    eras:
      - commit: "7d8005b79"
        label: "Faceted green raptor"
      - commit: "5afb92d2b"
        label: "Feathered SVG-rigged dromaeosaur"
        note: "Current design."
  gnu_ton:
    name: GNU-ton (the scholar riding the giant gnu)
    current_products: [sprites/gnu_ton_boss/gnu_ton_boss_spritesheet.ron]
    ids: [gnu_ton_boss]
    paths: ['gnu_ton']
    pick: 'frame:rest@gnu_ton_boss'
    summary: "a debate-bubble scholar on a gnu, to a powdered-wig Newton, to a gnu and a scholar drawn separately"
    tile_w: 300
    per_row: 4
    eras:
      - commit: "018b65d2d"
        label: "First GNU-ton"
        note: "The Hall of Bosses pantheon hub arrives with him; the rider is a speech-bubble figure. Claude Sonnet 4.6 declared."
      - commit: "91857f259"
        label: "Higher-res, more frames, layered output"
        note: "The gnu is rebuilt larger; the rider shrinks to a figure on its neck. Claude Opus 4.7 declared."
      - commit: "2fa1c78b1"
        label: "Powdered-wig scholar"
        note: "Newton: the apple-rain attack arrives with the wig. Claude Opus 4.7 declared."
      - commit: "59278ba1e"
        label: "Regenerated on the rig generators"
        note: "Converged with the Mockingbird's generators (Claude Opus 4.8 declared); the look barely moves."
      - commit: "87c1a49a3"
        label: "The scholar redrawn with his fight poses"
        note: "Claude Opus 5.5 declared."
  giant_gnu:
    name: The giant gnu, alone
    split_from: [gnu_ton]
    current_products:
      - sprites/gnu_ton_boss/giant_gnu_spritesheet.ron
      - sprites/gnu_ton_boss/giant_gnu_fist_spritesheet.ron
      - sprites/gnu_ton_boss/giant_gnu_hands_spritesheet.ron
    ids: [gnu_ton_boss]
    paths: ['gnu_ton']
    pick: 'frame:rest@giant_gnu'
    summary: "the fused giant, then the giant alone once the scholar was split off, then a giant that is almost a centaur"
    tile_w: 300
    per_row: 4
    # The last two eras were a second `giant_gnu` key (2026-10-11), which YAML
    # let replace this entry; they are joined here.
    eras:
      - commit: "018b65d2d"
        label: "Fused with the scholar"
        note: "In the first look the gnu and the rider are one sheet; the gnu is never drawn alone."
      - commit: "8bd7548f4"
        label: "G1: the fused giant+scholar split"
        note: "Claude Opus 4.8 declared."
      - commit: "506317748"
        label: "A lone-fist sheet and a scholar-sized rider sheet"
        note: "The giant is drawn on its own, large. Commit marked <synthetic>; Claude Opus 5.5 and GPT-6 sol credited."
      - commit: "a18c282"
        label: "A wildebeest of polygons, with a spiked hump"
        note: "The last commit with the first design. Its face was liked: goofy, and not on purpose."
      - commit: "a6e2ab1"
        label: "A giant like a gnu, almost a centaur"
        note: "Jon chose it in rounds of stills: a mythical giant, a slope for a back, a gnu's horns, a plain face. Claude Opus 5.5 declared."
  gnu_ton_scholar:
    name: The scholar (GNU-ton), alone
    split_from: [gnu_ton]
    current_products: [sprites/gnu_ton_boss/gnu_ton_rider_spritesheet.ron]
    ids: [gnu_ton_boss]
    paths: ['gnu_ton']
    pick: 'frame:rest@gnu_ton_rider'
    summary: "a rider small on the gnu's neck, then a pixel scholar of his own, then a smooth redraw"
    tile_w: 280
    per_row: 4
    # Observed 2026-10-07, not changed here: the Hall of Characters does not draw
    # this scholar as his own entry; only the giant gnu is drawn standalone.
    eras:
      - commit: "2fa1c78b1"
        label: "Powdered-wig rider on the gnu"
        note: "No standalone sheet exists yet: this is the whole boss sheet, the scholar a few pixels tall. Claude Opus 4.7 declared."
      - commit: "8bd7548f4"
        label: "G1: split off the giant"
        note: "The first scholar of his own: a pixel figure in a blue coat. Claude Opus 4.8 declared."
      - commit: "87c1a49a3"
        label: "Redrawn with his fight poses"
        note: "A smooth, outlined redraw. Claude Opus 5.5 declared."
  gnu_ton_scholar_rig:
    name: The scholar (GNU-ton), as an SVG rig
    continues: gnu_ton_scholar
    current_products:
      - sprites/gnu_ton_scholar_fighter_spritesheet.ron
      - sprites/gnu_ton_scholar_villain_spritesheet.ron
      - sprites/gnu_ton_scholar_boss_spritesheet.ron
    # `gnu_ton_scholar_boss` is the boss sheet: the same SVG and bones, its own rows.
    ids: [gnu_ton_scholar_fighter, gnu_ton_scholar_villain, gnu_ton_scholar_boss]
    paths: ['gnu_ton_scholar']
    summary: "a round face with a blush, then an old stern man in a full wig"
    # This is the scholar the game draws (the fighter and the boss sheets). The
    # lineage above is the rider on the fused boss sheet, which is other art.
    eras:
      - commit: "d377875"
        label: "A round face, large eyes, a tie wig"
        note: "The last commit with the first head of the rig. The commits that introduced the rig are not surveyed."
      - commit: "ba9ce46"
        label: "An old, stern man in a full wig"
        note: "Jon chose it from a sheet of five: the long wig, the older face, the neck clear. Claude Opus 5.5 declared."
  burning_flying_shark:
    name: Burning flying shark
    ids: [burning_flying_shark]
    paths: ['shark']
    summary: "a grey shark with a fire fin, then an SVG rig wreathed in fire, then a great white that burns along its whole back"
    tile_w: 300
    per_row: 4
    eras:
      - commit: "62886ed06"
        label: "First shark"
      - commit: "61f536265"
        label: "Procedural, no backdrop"
      - commit: "acf4f69d2"
        label: "SVG-rigged, fire-wreathed"
        note: "Polished (Oct 5). Dark over pale: Jon said it looked like an orca."
      - commit: "3185b29"
        label: "A great white under a sheet of fire"
        note: "Pale grey over white with a black eye; fire along the whole back, in six shapes of flame. Current design. Claude Opus 5.5 declared."
  treasure_chest:
    # Before October 2026 the chest was one texture of the batched `entities`
    # target (`chest_closed`); `boss_chest` and `treasure_chest` came later. The
    # survey found one drawn look of the dedicated target.
    name: Treasure chest
    ids: [entities]
    paths: ['chest', 'props/entities']
    pick: 'file:chest_closed.png'
    summary: "one chest drawn once, as a boss (big-item) chest"
    eras:
      - commit: "a9a563809"
        id: boss_chest
        pick: null
        label: "The boss (big-item) chest"
        note: "Royal blue and gold with a heavy lock; the first dedicated chest target. Claude Opus 5.5 declared."
