# Curated design history. A lineage is one CHARACTER as the player knows them;
# an era is one look, pinned to the commit that introduced it.
#
# Nothing here is an authority. An era is a commit id; its pixels are made by
# that commit's own code (see README.md). Edit this file when a design changes
# or a lineage's identity is clarified; never copy old art or code beside it.
#
# `ids`    target ids to try at each commit, newest name first (names changed)
# `paths`  regexes over renderer-relative paths; a commit touching one is a
#          candidate for `survey`
# `eras`   the curated looks, oldest first (empty until surveyed and judged)
# `forms`  the other looks the character has at one time (a power-up, a
#          transformation), each a list of targets oldest generation first:
#          `tall: [super_mary_o_tall, mary_o_v2_tall]`
lineages:
  alice:
    name: Alice
    ids: [alice, alice_cryptographer]
    paths: ['alice']
    summary: "from a jointed-puppet placeholder to an SVG-rigged courier"
    eras:
      - commit: "5d206dc8b"
        label: "Toon-rig placeholder"
        note: "Cryptography crew batch 1: one jointed template worn by Alice, Bob and the rest."
      - commit: "739c173d2"
        label: "Bespoke cryptographer"
        note: "Layered hair, a knee-length cinched coat over the checker tabard."
      - commit: "1dadefd72"
        label: "Face and hair pass"
        note: "End of the first day's iteration on the toon scaffold."
      - commit: "ac2c9c47f"
        label: "Teal jacket, satchel, letter"
        note: "The first full redraw; committed from Jon's account, subject names GPT-5.6."
      - commit: "b656e038c"
        label: "SVG cipher courier"
        note: "Red hair, white coat: the articulated SVG redesign."
      - commit: "341958b56"
        label: "Teal jacket and short dark hair, restored"
        note: "Jon asked for the jacket and hair back; poses refined."
      - commit: "d64c64d9a"
        id: alice
        label: "A rig: props, effects, faces are pieces"
        note: "The GPT 6 Alice; kept renderable as `alice`."
      - commit: "0d2b365"
        id: alice_v2
        label: "v2: chargen body, the old face, bag and letters"
        note: "Character generator body and poses (cast family), the GPT 6 face, bright teal lapels. Current design."
  bob:
    name: Bob
    ids: [bob, bob_engineer]
    paths: ['(^|/)bob', '_bob_']
    summary: "engineer: from a jointed-puppet placeholder to a bearded SVG-rigged fighter"
    eras:
      - commit: "5d206dc8b"
        label: "Toon-rig placeholder"
        note: "Cryptography crew batch 1."
      - commit: "90cf3b20d"
        label: "Bespoke engineer"
        note: "Vest, tool belt and workboots."
      - commit: "1dadefd72"
        label: "Face and hair pass"
      - commit: "38f1fec37"
        label: "Goggles and beard"
        note: "First full redraw (Jul 12); committed from Jon's account."
      - commit: "d64c64d9a"
        label: "A rig: props, effects, faces are pieces"
      - commit: "3ef6613c5"
        label: "Redrawn as an SVG-rigged fighter"
        note: "Current design."
  noether:
    name: Emmy Noether
    ids: [noether]
    paths: ['noether']
    summary: "Emmy: pixel-art puppet to a glowing SVG-rigged fighter"
    eras:
      - commit: "20407b51a"
        label: "Pixel-art puppet"
        note: "Teal suit, round glasses, hairpin antenna."
      - commit: "5d8e7628b"
        label: "Smooth puppet, tuned per character"
        note: "Rig refinement: per-character sprite tuning."
      - commit: "f4e126e7d"
        label: "Hand-traced SVG fighter"
        note: "A full fighter from standardized SVG labels."
      - commit: "6e928c569"
        label: "Purple dress"
        note: "Updated SVGs; committed from Jon's account."
      - commit: "c62c1d039"
        label: "Glow"
      - commit: "1a799c184"
        label: "Supersampled"
        note: "Current design."
  player_robot:
    # The repo's own lineage note (game/ambition_content/src/player_robot_lineage.rs):
    # `robot` (v0), `player_robot_v2` and `player_robot_v3` are three deliberately
    # distinct catalog characters in one lineage (`derived_from` is provenance
    # only; nothing is inherited); there is no v1. Each era names its own target id because
    # the id changed with the incarnation. The Fable candidate is a separate
    # experiment from the sprite-toolkit work, drawn from the same character
    # brief; it is shown in its place in time and was not an incarnation.
    name: The player robot (v0, v2, v3)
    ids: [robot]
    paths: ['(^|/)robot(\.yaml|\.py|_side|25d)', 'robot_side', 'robot25d', 'player_robot']
    summary: "one lineage, three characters"
    tile_w: 240
    per_row: 4
    eras:
      - commit: "8e67c1920"
        id: robot
        label: "v0: the toon puppet"
        note: "Promoted from proc2d_character_lab into the sprite tool; Claude Opus 4.7 declared."
      - commit: "2c69b7755"
        id: player_robot_fable
        label: "Fable 5's bone-and-keyframe candidate"
        note: "Added with the bone/keyframe sprite toolkit; an experiment, not a shipped incarnation."
      - commit: "60d97631c"
        id: player_robot_v2
        label: "v2: Keep the robot you used to be"
        note: "The earlier look kept as a playable, meetable v2."
      - commit: "442160508"
        id: player_robot_v3
        label: "v3: the current player robot"
        note: "Headphones, a cyan chest light and a lowered stance."
      - commit: "7726f1b52"
        id: player_robot_v3
        label: "v3, drawn from both sides"
        note: "The antenna stays on the far side from the camera."
      - commit: "d25dfd23a"
        id: robot
        label: "v0, redrawn as rig pieces"
        note: "The robot, boss, ninja, sandbag and toon families are drawn as pieces; this is the old robot, not v3."
  viking_warrior:
    name: Viking warrior
    ids: [viking_warrior]
    paths: ['viking']
    summary: "jointed paper puppet to a rigged character, 2026"
    group: vikings
    eras:
      - commit: "6b6e79206"
        label: "Paper puppet"
        note: "Procedural family drawing."
      - commit: "076d761b6"
        label: "Redrawn as rigs"
        note: "The four vikings redrawn (Oct 4). Current design."
  viking_shieldmaiden:
    name: Viking shieldmaiden
    ids: [viking_shieldmaiden]
    paths: ['viking']
    summary: "jointed paper puppet to a rigged character, 2026"
    group: vikings
    eras:
      - commit: "6b6e79206"
        label: "Paper puppet"
        note: "Procedural family drawing."
      - commit: "076d761b6"
        label: "Redrawn as rigs"
        note: "The four vikings redrawn (Oct 4). Current design."
  viking_heavy_warrior:
    name: Viking heavy warrior
    ids: [viking_heavy_warrior]
    paths: ['viking']
    summary: "jointed paper puppet to a rigged character, 2026"
    group: vikings
    eras:
      - commit: "6b6e79206"
        label: "Paper puppet"
        note: "Procedural family drawing."
      - commit: "076d761b6"
        label: "Redrawn as rigs"
        note: "The four vikings redrawn (Oct 4). Current design."
  viking_heavy_shieldmaiden:
    name: Viking heavy shieldmaiden
    ids: [viking_heavy_shieldmaiden]
    paths: ['viking']
    summary: "jointed paper puppet to a rigged character, 2026"
    group: vikings
    eras:
      - commit: "6b6e79206"
        label: "Paper puppet"
        note: "Procedural family drawing."
      - commit: "076d761b6"
        label: "Redrawn as rigs"
        note: "The four vikings redrawn (Oct 4). Current design."
  mockingbird:
    name: Mockingbird
    ids: [mockingbird_boss]
    paths: ['mockingbird']
    summary: "a long grey flier to a rocket-and-rotor songbird"
    tile_w: 300
    per_row: 4
    eras:
      - commit: "cc3dfa527"
        label: "First Mockingbird"
        note: "Flat grey flier."
      - commit: "bafa83591"
        label: "Actor contract sidecars"
      - commit: "5c0fb55a9"
        id: mockingbird_boss_v2
        label: "Candidate v2: SVG-rigged"
        note: "Oct 6 redraw begins."
      - commit: "296272f77"
        id: mockingbird_boss_v2
        label: "Jet wings, slender beak"
      - commit: "ced13c003"
        id: mockingbird_boss_v2
        label: "Hooded skull head"
        note: "Current design."
  raptor_stalker:
    name: Raptor stalker
    ids: [raptor_stalker]
    paths: ['raptor']
    summary: "a green faceted raptor to a feathered SVG-rigged one"
    tile_w: 300
