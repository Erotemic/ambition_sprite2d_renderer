# Wren, the Generalist: the Qwen parody among the bossofthegame's named
# agents, after Jon's concept sheet "Wren - The Generalist"
# (assets/concept_art/misc/agent-concepts/ in the game repo): the sheet's
# Field Agent hood and Engineer wrench (Jon, 2026-11-13: the wide hat and
# the fan were too much). The generator draws her body, her open cream robe,
# her purple scarf and belt; targets/characters/_band_agents_gear.py draws
# her visor and eyes, her hood and her wrench. Her skin is the dark of her
# chassis.
