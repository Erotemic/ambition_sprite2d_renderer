  description: 'A resident of Edo, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; Matsuo Bashō (1644 to 1694), the master of haikai poetry, whose short verses (hokku) are now called haiku. He was born in Iga province and came to Edo as a young man. He lived in a hut in Fukagawa, by the Sumida River, and took his name from a banana plant (bashō) that a student planted by it. He travelled on foot for months at a time and wrote of his journeys in prose and verse; the journey of 1689 with his companion Sora became Oku no Hosomichi ("The Narrow Road to the Deep North"). He died in Osaka in 1694, on another journey. The plain dark robe of a traveller who has given up the world, a narrow sash, a wide shallow hat of woven sedge tied under the chin, a cloth bundle at his hip on a strap, a walking staff and straw sandals; his head is shaved close. He is quiet and watchful, and he notices small things: a frog, a cicada, the sound of water.'
