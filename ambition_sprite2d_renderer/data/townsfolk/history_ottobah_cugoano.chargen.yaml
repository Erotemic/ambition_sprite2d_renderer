  description: 'A resident of the Gold Coast, the Africa floor of the History dimension (gate address DYNASTIC). Generated by chargen; Ottobah Cugoano (born about 1757), a real Fante man, drawn here as original art. When he was about thirteen, men took him from his home near the coast and sold him. He was held in a fort on this coast and then shipped across the Atlantic to the plantations of Grenada. In 1772 he was brought to England, where he became free, was baptised John Stuart and learned to read and write. In 1787, in London, he published Thoughts and Sentiments on the Evil and Wicked Traffic of the Slavery and Commerce of the Human Species: a book that said that the slave trade was a crime, that every person who took part in it was guilty, and that it must end at once, and every enslaved person be set free. He was one of the Sons of Africa, who wrote to the newspapers and to Parliament against the trade. He is drawn as the author in London in 1787: a dark brown coat, a buff waistcoat, a white cravat, dark breeches, white stockings and buckled shoes, and his book in his hand. He is composed and serious, and he looks at you directly.'
