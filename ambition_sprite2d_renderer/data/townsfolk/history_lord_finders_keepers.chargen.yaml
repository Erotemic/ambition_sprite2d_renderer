  description: 'A resident of Benin City, the Africa floor of the History dimension (gate address DYNASTIC). Generated by chargen; a parody of the British officers and museum keepers of 1897, when a British force burned Benin City, sent the Oba into exile and carried away thousands of the court''s brass plaques, heads and carved ivories, to be sold off and shown in museums far away. A pith helmet, a pale linen tunic, a monocle, a huge walrus moustache and a face red from the sun and from himself; a brass plaque under one arm and a ledger labelled "ON LOAN" in the other hand. He calls it keeping things safe, and he has been keeping them safe for a very long time.'
