  description: 'A resident of Waitangi, in the Bay of Islands, on 6 February 1840, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; Henry Williams (1792 to 1867), an English missionary. He was an officer in the Royal Navy as a young man. From 1823 he led the mission of the Church Missionary Society in the Bay of Islands, at Paihia. On the night of 4 to 5 February 1840 he and his son Edward translated the Treaty of Waitangi into Māori. The two texts do not say the same thing: in the English text the chiefs give sovereignty to the Queen, and in the Māori text they give her kāwanatanga, governorship. He died in 1867. He is drawn at 47: a black frock coat, a dark waistcoat and trousers, a white neck cloth, black shoes and grey-brown hair; a sheaf of papers in his hand. He is earnest and tired.'
