  description: 'A resident of Budj Bim, in Gunditjmara country in south-west Victoria, in the long life of its eel farms (from about 4600 BCE to the 1840s), on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Gunditjmara farmer of kooyang (short-finned eels). The lava flow of the volcano Budj Bim runs south to Tae Rak (Lake Condah). On it the Gunditjmara cut channels through the basalt and built weirs and ponds of stacked stone to trap, hold and grow eels, for at least 6,600 years: one of the oldest systems of aquaculture in the world, on the World Heritage list of UNESCO since 2019. They set long woven traps in the gaps of the weirs, smoked the eels in hollow trees and traded them. A cloak of possum skins sewn together, worn over the left shoulder and under the right arm, so the right arm is free; bare feet; dark curly hair and a beard; a long eel trap of plaited sedge held upright at his side. He is patient and sure, a man who knows every channel of the flow.'
