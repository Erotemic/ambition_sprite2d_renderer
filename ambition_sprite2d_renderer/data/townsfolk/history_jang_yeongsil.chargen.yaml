  description: 'A resident of Hanyang, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; Jang Yeong-sil (about 1390 to after 1442), the great engineer of Joseon. He was born of low rank (his mother was of government slave status), and King Sejong raised him to court office for his skill. He built the self-striking water clock (Jagyeongnu, 1434), whose bronze figures struck a bell, a drum and a gong to tell the hours, armillary spheres and sundials. He is remembered with the rain gauge (cheugugi, 1441), though the court record gives its design to the crown prince: a bronze cylinder set on a stone stand, its rain measured with a ruler, sent to every province of the kingdom. The rainfall was reported to the capital, some two centuries before Europe kept such records. In 1442 a royal sedan chair he had built broke, and he was dismissed; after that, nothing is known of him. A plain blue official''s robe and a black gauze hat, a bronze rain gauge in one hand and a measuring ruler in the other. He is inventive and modest: he would rather show you how it works.'
