  description: 'A resident of Sannai-Maruyama, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; an original Jomon man of Sannai-Maruyama in north Japan, about 3000 BCE. The people of the town did not farm, yet they did not wander: they tended the chestnut trees round the town and cleared the forest so that the chestnuts grew close, and each of the six great posts of the town''s largest building was a trunk of chestnut a metre thick. Chestnuts keep through the winter, and with walnuts, fish, shellfish and deer they fed the town for some 1,500 years. A tunic and leggings of plant fibre, a tall basket of woven vine on his back heaped with chestnuts, and a digging stick hardened in the fire. He is easy-going: the trees do most of the work, he says, and he only picks up after them.'
