  description: 'A resident of Taiwan, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; an original farmer of Nankuanli, near Tainan in the south-west of Taiwan, about 2500 BCE. Nankuanli holds the oldest grains of rice and foxtail millet yet found on Taiwan, from about 2800 BCE: the farmers who spoke the first Austronesian languages had brought them over the strait from the coast of China. The people of the village also fished and gathered shellfish, and they buried their dogs with care, as members of the household. A loincloth of plant fibre and a short jacket, a sheaf of foxtail millet in one arm, and a stone harvesting knife: a flat oblong blade with two holes for a cord loop round the fingers, for cutting the ears of grain one by one. He is cheerful: the harvest is in.'
