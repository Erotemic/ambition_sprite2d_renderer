  description: 'A resident of Marajó island at the mouth of the Amazon, on the floor of South America in the History dimension (gate address DYNASTIC). Generated by chargen; an original potter of the Marajoara culture, about 1000 CE. For about a thousand years (about 400 to 1400 CE) the people of Marajó built their villages on great earth mounds, the tesos, that stand above the floods of the wet season, and they made some of the finest pottery of the ancient Americas: bowls, jars and great urns covered in a white slip and painted, cut and modelled with red and black lines, stepped meanders and faces. A short cotton wrap skirt with a red and black border and a plain cotton top; on her forearms and shins, bands of red urucum (annatto) and black genipap paint; a white bowl painted in red and black bands in one hand and a fine brush, wet with red, in the other. She is patient and exact, and she can paint a straight line round a curved pot without looking up.'
