  description: 'A resident of Benin City, the Africa floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Edo caster of Igun Eronmwon, the guild of brass casters of the Oba of Benin, who lived and worked on Igun Street and cast only for the court. A white wrapper at the waist, bare chest, brass dust on his forearms; a small figure of yellow beeswax in one hand and long iron tongs that hold a glowing crucible in the other. He casts by lost wax: he models the figure in wax, covers it in clay, melts the wax out and pours brass in where it was. Each casting breaks its mould, so each work is the only one, and he is in no hurry to tell you how he gets the walls of a figure so thin.'
