  description: 'A resident of the Andean highlands, the Americas floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original farmer of the high Andes near Lake Titicaca, about 5,000 BCE. Her people were among the first to farm the potato, on a cold high plain where little else will grow. Over thousands of years they chose and planted again the best tubers, until there were thousands of kinds of potato, purple, red, yellow and white, long and round, each for its own field and its own use. They also learned to leave potatoes out in the frost of the night and the sun of the day until they were freeze-dried into chuño, which keeps for years. A cloak of hide with a border of woven plant fibre over a dress of the same fibre, and long braids; a wooden digging stick in one hand and a woven bag of potatoes of many colours in the other. She is practical and proud, and she knows the name of every kind in her bag.'
