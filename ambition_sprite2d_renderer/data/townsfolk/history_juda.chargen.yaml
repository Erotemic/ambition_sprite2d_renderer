  description: 'A resident of Bikini Atoll in 1946, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; Juda Kessibuki, the iroij-ladrikdrik (the chief) of the people of Bikini in 1946. In February 1946 a naval officer of the United States, Commodore Ben H. Wyatt, asked the Bikinians to leave their atoll, so that the United States could test atomic bombs "for the good of mankind". The people met, and Juda agreed. On 7 March 1946 the 167 Bikinians were moved to Rongerik Atoll, where there was too little food. Later they were moved to Kwajalein, and then to Kili Island. There were 23 tests at Bikini, and 67 in the Marshall Islands. A white shirt of the 1940s, plain trousers, short grey-black hair and bare feet; he holds a woven pandanus hat in front of him. He is quiet, dignified and grave.'
