  description: 'A resident of Tongatapu and Samoa in about 1200, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Tongan maker of ngatu, the tapa (bark cloth) of Tonga. Women strip the inner bark of the paper mulberry and beat it thin with a wooden beater (ike) on a log anvil (tutua). They join the beaten strips into long sheets, and they print brown patterns on them by rubbing dye over the cloth on a pattern board (kupesi). Women do this work together, and the sound of the beaters carries through the village. A wrap of ngatu with brown printed bands from the waist to the shins, a kiekie (a girdle of fibre strands) at the waist, a plain top cloth and bare feet; her hair is tied back, and she holds an ike, a wooden beater, square in section, with fine grooves along its faces. She is friendly and steady, and she keeps the rhythm.'
