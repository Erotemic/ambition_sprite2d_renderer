  description: 'A resident of an atoll of the Marshall Islands, between about 1500 and 1900, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Marshallese weaver of pandanus mats. The leaves of the pandanus are dried and softened, and then cut into strips. The strips are plaited into mats for sleeping, for sails and for clothing. A wrap of fine woven pandanus matting from the waist to below the knees, a plain top cloth, her dark hair tied back and bare feet; she holds a half-made mat, a pale gold checker of plaited strips with loose strip ends at one edge. She is patient, and her hands are quick.'
