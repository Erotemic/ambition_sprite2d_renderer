  description: 'A resident of Waitangi, in the Bay of Islands, on 6 February 1840, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; Hōne Heke Pōkai (about 1807 to 1850), a chief of Ngāpuhi. At Waitangi on 6 February 1840 he spoke for the Treaty, and he was among the first chiefs to sign it. Later he came to see the British flag on Maiki Hill, above Kororāreka, as a sign that the land was lost. He cut down the flagstaff four times in 1844 and 1845, and the Northern War followed. He died in 1850. He is drawn at about 33: a white shirt and dark trousers under a cloak of brown kiwi feathers (kahu kiwi), close round his shoulders, and a mere of greenstone at his belt. He wore full facial moko (tā moko); it is shown only as a few soft lines. He is proud and direct.'
