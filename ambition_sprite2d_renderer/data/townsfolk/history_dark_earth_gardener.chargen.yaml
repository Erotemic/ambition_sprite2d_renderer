  description: 'A resident of the Amazon floodplain, upriver from Marajó island, on the floor of South America in the History dimension (gate address DYNASTIC). Generated by chargen; an original gardener of the Amazon, about 1000 CE, when the forest along the great river was partly a garden: people planted and tended useful trees such as the Brazil nut and the peach palm, and grew manioc, maize and squash near their villages. Around their homes, over many generations, they made terra preta, "dark earth": soil that is black with charcoal from slow fires, with broken pots, ash, bones and the waste of the kitchen worked into it. The thin soil of the rainforest washes out fast, but the dark earth stays rich, and farmers still dig and sell it today. A cotton loincloth on a waist cord, a woven palm-fibre bag on a strap, a band of red, yellow and blue parrot feathers on his arm, a digging stick hardened in the fire in one hand and, in the other, a basket of charcoal and potsherds for his garden. He is cheerful, and he will tell you that his great-grandchildren will thank him for this soil.'
