  description: 'A resident of Benin City, the Africa floor of the History dimension (gate address DYNASTIC). Generated by chargen; Idia, a real queen mother of Benin in the early 1500s, the mother of Oba Esigie. When Esigie had to fight for his throne and then for his kingdom against Igala, she raised an army, gave counsel, and some say rode to war herself; Esigie made her the first Iyoba, the queen mother, with her own palace at Uselu. A tall crown of a net of red coral beads that points forward and up, a high collar of many strands of coral beads, a white wrapper, and in her hand an eben, the broad sword of iron with openwork that the chiefs of Benin carry and turn in the air in honour. She is calm, she is sure, and the court still remembers her.'
