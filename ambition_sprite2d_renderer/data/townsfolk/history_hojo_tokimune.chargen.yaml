  description: 'A resident of Hakata Bay in 1281, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC), though he governed from Kamakura. Generated by chargen; Hōjō Tokimune (1251 to 1284), the eighth regent (shikken) of the Kamakura shogunate, who held the real power from 1268, when he was seventeen. Kublai Khan sent letters that asked Japan to submit, and he refused them. After the first invasion, in 1274, he ordered the defence of Kyushu, and the warriors of Kyushu built a dry stone wall (the Genkō bōrui) about 20 km long along Hakata Bay; in 1281 it kept the second fleet from landing in force. He died in 1284, at thirty-three. The hitatare of a warrior of rank in deep blue: a jacket with wide sleeves, cords through their cuffs and small tufts on its seams, over long wide hakama of the same colour, tied at the waist; a white under-collar, a folded cap of black lacquer (samurai eboshi) over his topknot, and a closed folding fan. He is calm and decisive, and he says little.'
