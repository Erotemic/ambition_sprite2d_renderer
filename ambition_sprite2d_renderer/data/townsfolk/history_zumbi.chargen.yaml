  description: 'A resident of Palmares, on the Serra da Barriga in Alagoas, on the floor of South America in the History dimension (gate address DYNASTIC). Generated by chargen; Zumbi dos Palmares (1655 to 1695), the last leader of the Quilombo dos Palmares, a free state in the hills of north-east Brazil that people who had escaped slavery held for nearly a century. He was born in Palmares in 1655 and taken as a baby by a Portuguese expedition; a Portuguese priest raised him, and the story goes that the priest baptised him Francisco and taught him Portuguese and Latin. At about 15 he escaped and went back to Palmares. In 1678 its leader, Ganga Zumba, accepted a treaty with the governor of Pernambuco that freed only those born in Palmares; Zumbi rejected it, and he led Palmares from then on against expedition after expedition. Its capital on the Serra da Barriga fell in 1694. He was betrayed and killed on 20 November 1695. That day is now Black Consciousness Day (Dia da Consciência Negra), a national holiday in Brazil since 2024 and a holiday in many states and cities before that. No portrait of him exists; he is drawn as a man of Palmares about 1680 might look: a loose cotton shirt and cotton trousers, a red cloth sash knotted at his hip, and a spear held upright at rest. He is calm and dignified, and he speaks little and is heard.'
