  description: 'A resident of Lake Mungo, in the Willandra Lakes, about 40,000 years ago, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Aboriginal Discovery Ranger of Mungo National Park, a Mutthi Mutthi woman of today. The Paakantyi (Barkindji), Mutthi Mutthi and Ngiyampaa peoples are the traditional owners of the Willandra Lakes, and they care for the park together with the park service. She takes visitors to the Walls of China, the long dune on the east shore of the dry lake that wind and rain have cut into pinnacles and gullies. She also tells them about the footprints: more than 700 human footprints set in hard clay about 20,000 years ago, of adults and children, and of a man who ran. A young Mutthi Mutthi woman, Mary Pappin Jr, found them in 2003. She is of today, not of 40,000 years ago; she stands here to show the visitors her country. A khaki ranger''s shirt with short sleeves and a small badge, dark green trousers, a belt, boots and a wide-brimmed khaki hat; a small notebook with a pencil in her hand. She is warm and sure, and a little dry.'
