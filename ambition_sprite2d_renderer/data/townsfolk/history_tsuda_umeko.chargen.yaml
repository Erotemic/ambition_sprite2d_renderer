  description: 'A resident of Tokyo in 1872, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; Tsuda Umeko (1864 to 1929), teacher. In 1871, at six, she was the youngest of five girls who sailed with the Iwakura Mission to study in the United States. She lived with Charles and Adeline Lanman in Washington, and came home in 1882 after eleven years. She taught English, studied biology at Bryn Mawr College from 1889 to 1892, and in 1900 founded the Joshi Eigaku Juku, a school of higher learning for women, which is now Tsuda University. In 1872 she was a child in Washington; she stands here as the young woman who came home. A plum-coloured dress of the 1880s: a fitted bodice buttoned down the front, with a high collar and long close sleeves, a draped overskirt over a bustle with a bow at the back, and button boots; her hair is up in a bun, and she holds a book. She is earnest and determined, and when she came home she had to learn Japanese again.'
