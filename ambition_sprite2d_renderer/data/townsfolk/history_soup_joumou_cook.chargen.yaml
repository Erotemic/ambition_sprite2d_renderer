  description: 'A resident of Haiti, the Americas floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original cook of 1 January 1804, the day that Haiti declared itself free. Under slavery, the masters ate soup joumou, a rich soup of squash (joumou) with beef, vegetables and spices, and the enslaved who cooked it were not allowed to eat it. On the first day of independence, everyone ate it. Every 1 January since then, Haitians everywhere cook soup joumou and share it with family, friends and neighbours; in 2021 UNESCO put it on its list of the intangible heritage of humanity. A white shirt with rolled sleeves, a cloth apron and a straw hat; a big wooden ladle in one hand and a whole orange squash under his other arm. He is warm and generous, and nobody leaves his pot with an empty bowl.'
