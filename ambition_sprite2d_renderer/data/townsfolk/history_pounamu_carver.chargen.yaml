  description: 'A resident of Aotearoa in about 1400, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Māori worker of pounamu (greenstone) of about 1400. Pounamu came from Te Waipounamu, the South Island. She cuts it with saws of sandstone and grinds it on sandstone with water, for weeks, into adzes (toki) and ornaments. Pounamu is very hard, and a polished blade keeps its edge. A plain, finely woven flax cloak with a dark border band, a flax wrap at the waist and bare feet; a polished blade of deep green pounamu for an adze in her hand. She is patient and precise.'
