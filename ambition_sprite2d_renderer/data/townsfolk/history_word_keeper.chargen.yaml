  description: 'A resident of the Austronesian islands, the Southeast Asia floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Austronesian woman of the coasts of the Philippines and Indonesia, about 2000 BCE. Her people came south from Taiwan in outrigger canoes, with pigs, dogs, taro and bananas, and built houses on stilts by the sea. In time their languages ran from Madagascar to Hawaii and Rapa Nui: one family of languages over half the world. "Mata" is "eye" in many of them, and she can tell you the word for "eye" on a dozen islands. A skirt and a shawl of beaten bark cloth (tapa) with a simple printed pattern of brown triangles, fine lines tattooed on her forearms, a string of shell beads, and a round pot of red-slipped clay in a carrying net. She is warm and talkative, and every word she keeps is a word that travelled.'
