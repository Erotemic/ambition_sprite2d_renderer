  description: 'A resident of Tongatapu and Samoa in about 1200, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; Tuʻitātui (lived about 1200), the 11th Tuʻi Tonga, the paramount chief of Tonga. He had the Haʻamonga ʻa Maui built at Heketā on Tongatapu: a trilithon of two uprights of coral limestone, each about 5 m high, with a lintel set in notches cut in their tops. In 1967 King Tāufaʻāhau Tupou IV said that marks cut in the top of the lintel point to the sunrise on the longest and the shortest days of the year. No portrait of Tuʻitātui exists; he is drawn as a Tongan chief of his time. A fine wrap of ngatu (tapa) from the waist to the shins, pale buff with brown printed bands, a taʻovala (a fine mat of pandanus) round his waist, tied with a cord of plaited fibre, a cloth of tapa over one shoulder, a necklace of small white shells and bare feet. He is dignified and calm.'
