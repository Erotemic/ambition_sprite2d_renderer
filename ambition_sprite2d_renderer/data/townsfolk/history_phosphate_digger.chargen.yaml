  description: 'A resident of Nauru, between about 1920 and 1968, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Chinese contract labourer of the 1930s. From 1920 the British Phosphate Commissioners mined the phosphate of Nauru. They brought workers on contracts from China, through Hong Kong, and from the Gilbert and Ellice Islands. The workers dug the phosphate by hand from between the pinnacles of coral limestone, and loaded it into rail trucks. A loose pale collarless shirt, plain trousers rolled at the shin, a wide straw hat and bare feet; he holds a long-handled shovel at rest, its blade down by his foot. He is quiet, tired and steady.'
