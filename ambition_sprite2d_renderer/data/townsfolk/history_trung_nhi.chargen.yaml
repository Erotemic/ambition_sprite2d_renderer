  description: 'A resident of the Red River delta, the Southeast Asia floor of the History dimension (gate address DYNASTIC). Generated by chargen; Trưng Nhị, a noblewoman of northern Vietnam, the younger of the Trưng sisters. In 40 CE she and her sister Trưng Trắc led a rising of the Lạc lords and the people of the delta against the rule of the Han empire, and she led their forces at her sister''s side; for three years the delta was theirs again. The sisters are honoured in Vietnam to this day, with temples, streets and a festival. A long dark green tunic over trousers, a belt with gold, her hair in a knot under a headband of green and gold, and a short war banner of gold and green on a staff with a bronze point. She is dignified and resolute.'
