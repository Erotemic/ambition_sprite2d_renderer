  description: 'A resident of the Congo river in 1904, on the Africa floor of the History dimension (gate address DYNASTIC). Generated by chargen; George Washington Williams (1849 to 1891), African-American soldier, historian and lawyer. As a boy he fought for the Union in the Civil War. In 1880 he became the first African-American member of the Ohio legislature, and in 1882 he published his History of the Negro Race in America. In 1890 he went up the Congo river and wrote "An Open Letter to His Serene Majesty Leopold II", the first public account of the abuses there; in a report for the United States he called them "crimes against humanity". He died in Blackpool, in England, in 1891, aged 41. He came to the Congo in 1890 and did not live to see 1904; he stands here as the first witness. A dark three-piece suit of about 1890 with a watch chain, a white shirt with a high collar and a dark tie, short hair and a full moustache; a pen and a few papers in his hands. He is eloquent and exact, and he writes down what he sees.'
