  description: 'A resident of Silla, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; Queen Seondeok, who ruled Silla from 632 to 647 CE, the first of its three ruling queens. Stories of her quick wit were told for centuries: when the Tang emperor sent her a painting of peonies with their seeds, she saw that it showed no bees or butterflies and said that the flowers would have no scent; when they bloomed, they had none. In her reign Silla built Cheomseongdae, the oldest standing observatory in East Asia, sent students to study in Tang China, and stood against attacks from Baekje and Goguryeo, while her generals Kim Yusin and Kim Chunchu prepared the way for the unification of the peninsula. A robe of deep blue silk over red, with a wide red collar, red cuffs and a red border at its hem, a gold crown of the kind found in the royal tombs of Gyeongju, with uprights like trees and antlers, hung with gold discs and curved jades (gogok), a gold girdle with pendants, and a round silk fan painted with a peony. (The crowns in the tombs are a century or more older than her reign.) She is dignified, and very hard to fool.'
