  description: 'A resident of Haiti, the Americas floor of the History dimension (gate address DYNASTIC). Generated by chargen; Catherine Flon, a real seamstress of Arcahaie, drawn here as original art. On 18 May 1803, at the congress of Arcahaie, the leaders of the revolution swore to fight together for independence. Jean-Jacques Dessalines took the French flag and tore the white band out of it, and Catherine Flon sewed the blue and the red together: the first flag of Haiti. Tradition says that she was his goddaughter. Every 18 May, Haiti keeps Flag Day, and her name is said with it. A madras headwrap (a tignon) in red and yellow check, a white blouse, a long blue skirt and an apron; in her hands the flag, blue at the hoist and red at the fly, its seam still new, and a needle with its thread. She is proud and steady, and her stitches are small and even.'
