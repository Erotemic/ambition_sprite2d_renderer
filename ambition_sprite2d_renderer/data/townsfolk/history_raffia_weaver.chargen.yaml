  description: 'A resident of Mbanza Kongo in about 1526, on the Africa floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original weaver of raffia cloth of Kongo. In Kongo men wove the fibre of the raffia palm on an upright loom. The finished squares, about 60 cm on a side, were sewn together into wraps, and some were cut into a soft pile; Europeans called that cloth "Kongo velvet". Cloth also served as money. A plain wrap of raffia cloth at the waist, a plain cloth over one shoulder and bare feet; in his hands a square of finished cloth, tan with a darker woven pattern. He is proud of his work and glad to show it.'
