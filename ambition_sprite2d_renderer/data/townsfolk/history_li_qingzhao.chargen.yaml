  description: 'A resident of Hangzhou, on the floor of East Asia in the History dimension (gate address DYNASTIC). Generated by chargen; Li Qingzhao (1084 to about 1155), the greatest woman poet of China and one of the great poets of the Song. She wrote ci, song lyrics set to tunes, in plain and exact words: a few lines about a chrysanthemum, a cup of wine or rain on a plane tree, which hold a whole life. With her husband Zhao Mingcheng she collected bronzes, stone rubbings and old books, and they catalogued the inscriptions together; when the Jin armies took the north in 1127 the collection was lost, cart by cart, on the road south. Her husband died in 1129, and she lived on alone in the new southern capital at Hangzhou, where her later poems are some of the saddest in the language. She also wrote an essay that criticised famous male poets by name, which was not done. A Song-style robe of pale green, open at the front over a white blouse and a long white skirt, her hair up with a simple hairpin, a folded paper fan in one hand and a poem scroll in the other. She is thoughtful, a little sad, and very sharp.'
