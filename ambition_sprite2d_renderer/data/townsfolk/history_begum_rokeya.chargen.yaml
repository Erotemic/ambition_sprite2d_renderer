  description: 'A resident of the room of Dhaka, 1905 to 1971, on the floor of South Asia in the History dimension (gate address DYNASTIC). Generated by chargen; Begum Rokeya Sakhawat Hossain (1880 to 1932), writer, educator and campaigner for the education of girls and women. She was born in Pairaband, in Rangpur, and as a girl she learned Bengali and English at night from her elder brother, because the girls of her family were not taught them. In 1905 she wrote "Sultana''s Dream" in English; it was published that year in The Indian Ladies'' Magazine of Madras. In the story women run Ladyland: they take their power from the heat of the sun, travel in flying air-cars, and keep the men at home. After her husband Syed Sakhawat Hossain died, she founded the Sakhawat Memorial Girls'' School in Bhagalpur in 1909, and in 1911 she moved it to Calcutta. In 1916 she founded the Anjuman-e-Khawateen-e-Islam, an association of Muslim women. In Bangladesh, 9 December, the day she was born and the day she died, is Rokeya Day. A cream sari with a deep red border, its end drawn over her head and across her body, a long-sleeved blouse of dark red, round spectacles, a book in one hand and a small brass model of an air-car in the other. She is determined and witty.'
