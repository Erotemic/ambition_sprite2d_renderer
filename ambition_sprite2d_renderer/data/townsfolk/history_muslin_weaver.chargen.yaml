  description: 'A resident of Dhaka, on the floor of South Asia in the History dimension (gate address DYNASTIC). Generated by chargen; an original master weaver of Dhaka muslin, about 1700, when Bengal was the richest province of the Mughal empire. The finest muslin was woven from phuti karpas, a cotton with a short, soft fibre that grew along the banks of the Meghna. Women spun it by hand into a thread finer than any machine of the age could make, and weavers like him worked it on simple hand looms; one fine piece could take months. The best cloth was made for the Mughal court, and its names tell how fine it was: baft-hawa, "woven air", and shabnam, "morning dew". It was said that a whole length of it could be drawn through a finger ring. A white dhoti to the ankle, a short white upper cloth, a cotton shawl with a red border over his shoulders, a wooden shuttle in one hand and, in the other, a fold of muslin so fine that it looks like mist. He is proud and precise, and he knows every thread of his work.'
