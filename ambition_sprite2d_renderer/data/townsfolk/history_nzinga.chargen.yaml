  description: 'A resident of Ndongo and Matamba in about 1630, on the Africa floor of the History dimension (gate address DYNASTIC). Generated by chargen; Nzinga Mbande (about 1583 to 1663), queen of Ndongo and Matamba. In 1622 she went to Luanda as the envoy of her brother, the king of Ndongo. The Portuguese governor sat in a chair and gave her none, so her servant knelt and Nzinga sat on her back, eye to eye with him; she made a peace treaty. She ruled Ndongo from 1624 and took Matamba in about 1631. For some thirty years she fought Portugal from her war camps (kilombo), and from 1641 to 1648 she fought beside the Dutch. She made peace with Portugal in 1656, and she died a queen in 1663, aged about 80. She is drawn at about 50: a wrap of fine red cloth with a woven yellow border from the chest to the ankles, a dark blue cloth over one shoulder, necklaces of glass beads, bracelets and armlets of copper, a headdress of beads with a few feathers, sandals, and a bow held upright at rest at her side, because she was an archer. She is commanding and patient, and she does not give way.'
