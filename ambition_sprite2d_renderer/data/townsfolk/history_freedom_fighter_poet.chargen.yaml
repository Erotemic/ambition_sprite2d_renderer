  description: 'A resident of the room of Dhaka, 1905 to 1971, on the floor of South Asia in the History dimension (gate address DYNASTIC). Generated by chargen; an original young poet of 1971, the year of the war of independence of Bangladesh. On the night of 25 March 1971 the Pakistan army began a crackdown in Dhaka, and on 26 March the independence of Bangladesh was declared. Through nine months of war, Swadhin Bangla Betar Kendra, the radio station of free Bengal, broadcast news, songs and poems to the people at home and to the millions who had fled to India as refugees; people listened on small transistor radios, often in secret. The war ended on 16 December 1971, and Bangladesh was independent. A checked lungi to the ankle, a plain shirt with its sleeves rolled up, a cloth bag on a strap across his body, an exercise book of poems in one hand and a small transistor radio in the other. He is tired, and hopeful.'
