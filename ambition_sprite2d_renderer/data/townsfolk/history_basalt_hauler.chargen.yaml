  description: 'A resident of Nan Madol, off Pohnpei, between about 1180 and 1628, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Pohnpeian man of about 1200, a builder of Nan Madol. The builders laid columns of black basalt crosswise, course on course, round a fill of coral rubble. The columns came from quarries on Pohnpei. How the people moved them is still not known: perhaps they floated them on rafts. A loincloth of woven fibre, a bare chest, his dark hair tied back, bare feet and a little grey stone dust on him; he carries a short basalt column on his shoulder. He is steady.'
