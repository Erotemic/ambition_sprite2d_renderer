  description: 'A resident of Silla, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; an original astronomer of Silla, about 640 CE, in the reign of Queen Seondeok. Cheomseongdae, near the royal palace at Gyeongju, is a bottle-shaped tower of 362 cut granite stones, about nine metres high, with a square window halfway up and a square frame at its top. It is held to be the oldest standing observatory in East Asia, though scholars still argue how it was used. The court watched the sky to keep the calendar and to read its signs: eclipses, comets and the paths of the planets were written down. A plain grey-blue scholar''s robe and a cap of black gauze, a bamboo sighting tube in one hand and a rolled star chart in the other. He is patient: a comet may take years to come, and he means to be there when it does.'
