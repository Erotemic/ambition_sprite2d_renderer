  description: 'A resident of Dhaka, on the floor of South Asia in the History dimension (gate address DYNASTIC). Generated by chargen; an original spinner of the fine muslin thread, about 1700. The thread for Dhaka muslin was spun by women, by hand, from the cotton phuti karpas. First the cotton was cleaned with the jawbone of the boal (boalee), a river catfish, whose small close teeth made a fine comb. Then it was spun on a slim spindle into a thread so thin that the eye could hardly follow it. The fibre breaks when it is dry, so the spinners worked in the damp air of the morning and the evening, and kept their fingers damp from a little bowl of water. A plain cotton sari of pale blue with a narrow red border, its end over her shoulder, the fish-jaw comb tucked at her waist, a spindle in one hand and the bowl in the other. She is patient and sharp-eyed, and she does not let anyone touch the thread.'
