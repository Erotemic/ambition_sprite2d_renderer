  description: 'A resident of the strait of Srivijaya, the Southeast Asia floor of the History dimension (gate address DYNASTIC). Generated by chargen; Yijing (635-713), a Chinese Buddhist monk of the Tang dynasty. In 671 he sailed from Guangzhou on a Persian ship to Srivijaya, where he stayed six months to learn Sanskrit before he went on to the great monastery of Nalanda in India. He came back to Srivijaya and worked there for years more, copying and translating texts. He wrote that more than a thousand monks studied in the city, and he told other Chinese pilgrims to study there first. His books are among the oldest records of Srivijaya. A plain robe of brown ochre, a shaved head, sandals, a bundle of palm-leaf manuscripts tied with cord, and a writing brush. He is calm and exact, and he will check your grammar.'
