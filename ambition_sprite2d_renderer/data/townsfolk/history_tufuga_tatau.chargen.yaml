  description: 'A resident of Tongatapu and Samoa in about 1200, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original master tattooist of Samoa (tufuga tātatau). He taps the pigment into the skin with an au, a small comb of sharpened bone lashed to a plate of turtle shell on a short wooden handle, and he strikes it with a light stick (sausau). The peʻa, the tattoo of a man from the waist to the knees, takes many sessions; a man who completes it is honoured. A plain lavalava (a wrap of cloth) at the waist, his own peʻa dark on his thighs below it, his hair tied back and bare feet; the au in one hand and the sausau in the other. He is calm and exact.'
