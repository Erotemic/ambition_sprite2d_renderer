  description: 'A resident of Palmares, on the Serra da Barriga in Alagoas, about 1680, on the floor of South America in the History dimension (gate address DYNASTIC). Generated by chargen; an original resident, a blacksmith of the Quilombo dos Palmares. Palmares was a free state in the hills of north-east Brazil, made by people who escaped slavery on the sugar plantations of the coast. It lasted for most of the seventeenth century, and thousands of people lived in its villages (mocambos). Many of its people came from Central Africa, from the lands of Kongo and Angola, where smithing was an old and honoured craft. With those skills the smiths of Palmares built its tools and its defences: their forges made hoes and bill-hooks for the fields of maize, beans and manioc, and blades. A leather apron over plain cotton trousers, bare arms and plain leather shoes; a hammer in one hand, and in the other, tongs that hold a hoe blade still glowing from the fire. He is steady, proud of his work and slow to waste a word.'
