  description: 'A resident of Warrane (Sydney Cove) in 1788, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; Woollarawarre Bennelong (about 1764 to 1813), a Wangal man of the Eora. In November 1789 Governor Arthur Phillip had him seized, to learn the language of the people. He escaped in 1790, and later he came back on his own terms. Phillip had a hut built for him on the point that is now Bennelong Point, where the Sydney Opera House stands. In 1792 he sailed to England with Phillip, and he came home in 1795. He died in 1813. In 1788 he was about 24, and he did not yet know the colonists; he is drawn as he dressed in the colony in the 1790s: a long dark blue coat, a buff waistcoat, a white shirt and neck cloth, dark trousers and plain shoes, short curly hair and a short beard. He is dignified and quick, a man between two worlds.'
