  description: 'A resident of Rio de Janeiro in May 1888, on the floor of South America in the History dimension (gate address DYNASTIC). Generated by chargen; André Rebouças (1838 to 1898), Black Brazilian engineer and abolitionist. He was born in Cachoeira, in Bahia, and trained as an engineer; in Rio de Janeiro he built docks for the port. In 1880, with Joaquim Nabuco and others, he founded the Brazilian Anti-Slavery Society, and he wrote and spoke for abolition for years. He said that freedom was not enough: the freed people must also have land of their own to farm. He was a friend of the imperial family, and of Princess Isabel, who signed the Golden Law on 13 May 1888. When the republic was declared in 1889 he went into exile with the emperor and his family, and he did not come home again; he died in Funchal, on Madeira, in 1898. A dark frock coat and waistcoat with a watch chain, a white shirt and a black bow tie, short hair and a full dark beard; he holds rolled plans of an engineering work. He is precise and courteous, and he talks of the future.'
