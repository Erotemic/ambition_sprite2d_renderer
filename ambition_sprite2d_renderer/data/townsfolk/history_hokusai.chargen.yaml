  description: 'A resident of Edo, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; Katsushika Hokusai (1760 to 1849), painter and print designer of Edo. His Thirty-six Views of Mount Fuji (about 1830 to 1832) include "The Great Wave off Kanagawa". From 1814 he filled many volumes of sketches, the Hokusai Manga. He used more than thirty names and moved house about ninety times. He called himself "the old man mad about painting", and at seventy-five he wrote that by a hundred and ten every dot and line he drew would be alive. His daughter Katsushika Ōi was a painter too, and worked with him. Here he is an old man in his seventies: a plain kimono of dull indigo with a narrow brown sash, geta, a bald head with a thin fringe of white hair, a painting brush in one hand and a sketch of a wave in the other. He is restless and blunt, and he is never satisfied with his last picture.'
