  description: 'A resident of an atoll of the Marshall Islands, between about 1500 and 1900, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Marshallese navigator (ri-meto). Navigators learned the swells of the ocean, the way they bend round islands and cross each other, from stick charts: frames of palm-rib sticks tied together, with small shells for the islands. A mattang teaches the swells; a meddo or a rebbelib shows real islands. At sea the navigator did not carry the charts: he felt the swells through the hull. A waist wrap of fine woven pandanus matting, pale gold with a dark band at its edge, a bare chest, grey hair and bare feet; he holds a small stick chart. He is calm, weathered and attentive.'
