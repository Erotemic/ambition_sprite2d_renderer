  description: 'A resident of Rio de Janeiro in May 1888, on the floor of South America in the History dimension (gate address DYNASTIC). Generated by chargen; Luís Gama (1830 to 1882), lawyer, poet and abolitionist. He was born free in Salvador, in Bahia, in 1830, the son of Luísa Mahin, a free African woman. When he was ten, his own father sold him into slavery, and he was taken south to São Paulo. At seventeen he learned to read; he found the proof that he was born free, and he won his freedom. He taught himself the law, and in the courts of São Paulo he freed hundreds of enslaved people: more than five hundred, he said. He was also a poet; his book of satirical verse, Primeiras Trovas Burlescas, came out in 1859. He died in São Paulo in 1882, and a great crowd followed his coffin. He did not live to see 13 May 1888, and he worked in São Paulo, not in Rio; he stands here among the abolitionists whose work brought the Golden Law. A dark brown suit, a white shirt and a black bow tie, a moustache and a full beard; a law book in one hand and a sheaf of papers in the other. He is quick, witty and fearless.'
