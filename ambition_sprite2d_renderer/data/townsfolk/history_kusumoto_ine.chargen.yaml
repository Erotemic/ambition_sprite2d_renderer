  description: 'A resident of Tokyo in 1872, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; Kusumoto Ine (1827 to 1903), the first Japanese woman doctor of Western medicine. She was born in Nagasaki, the daughter of Kusumoto Taki and Philipp Franz von Siebold, a German doctor at the Dutch trading post of Dejima, who was sent out of Japan in 1829. She studied medicine and obstetrics with her father''s former students and with Dutch doctors in Nagasaki, and became an obstetrician. In 1870 she opened a practice in Tokyo, and in 1873 she attended at a birth in the imperial household. A plain dark indigo kimono of good cloth with a sober brown obi, her hair in a simple bun with no ornaments, and geta; she carries a doctor''s bag of dark leather with a steel frame. She is calm and exact, and she does not give up.'
