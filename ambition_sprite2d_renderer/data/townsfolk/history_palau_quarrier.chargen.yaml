  description: 'A resident of Yap, between about 1500 and 1900, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Yapese man who quarried rai in Palau. With the permission of the chiefs of Palau, Yapese men sailed about 400 km to Palau and cut the discs from the limestone there, with tools of shell (and of iron, after about 1870). They brought the stones back to Yap by canoe and raft, a voyage that could kill. A plain thu (a loincloth of hibiscus fibre), a bare chest, his dark hair tied back, bare feet and a pale dust of limestone on his arms, chest and legs; he holds an adze with a blade of giant-clam shell, at rest. He is tired, and proud of the work.'
