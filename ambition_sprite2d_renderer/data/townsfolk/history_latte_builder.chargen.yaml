  description: 'A resident of Guåhan (Guam) in the Marianas, between about 1000 and 1670, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Chamorro (CHamoru) woman of about 1000 CE, who helps to raise latte stones. A latte is a stone pillar (haligi) with a capstone (tasa) on its top. The people cut the pillars and the capstones from limestone or basalt in quarries, and they set them in two rows to hold a house up off the ground. A wrap skirt of woven pandanus to the knees, a plain top cloth, her dark hair tied back and bare feet; she holds a stone adze, a blade of ground stone on a wooden handle, head down at her side. She is steady and practical.'
