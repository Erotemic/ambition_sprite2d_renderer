  description: 'A resident of the Congo river in 1904, on the Africa floor of the History dimension (gate address DYNASTIC). Generated by chargen; William Henry Sheppard (1865 to 1927), African-American missionary and explorer from Virginia. He went to the Congo in 1890. In 1892 he was the first foreigner to reach the capital of the Kuba kingdom, and the Royal Geographical Society made him a fellow; his collection of Kuba art is at Hampton University. In 1899 he went to the place of a raid by men in the service of the Free State, counted the dead and reported it, and his report went round the world. For what he wrote, he was tried for libel at Léopoldville in 1909, and he was acquitted. He is drawn as he was in 1899, at about 35: a white tropical suit, a white pith helmet, brown boots and a moustache, and a small notebook and a pencil in his hands. He is tall, warm and fearless, and he listens before he speaks.'
