  description: 'A resident of Tokyo in 1872, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; Fukuzawa Yukichi (1835 to 1901), writer, teacher and the founder of Keiō Gijuku. He studied Dutch learning in Osaka; in Yokohama in 1859 he found that the foreigners spoke English, and he taught himself English. He sailed to San Francisco on the Kanrin Maru in 1860, and went to Europe with the mission of 1862. His books explained the West to Japan: Conditions in the West (Seiyō Jijō, 1866) and An Encouragement of Learning (Gakumon no Susume, 1872 to 1876), which begins: "It is said that heaven does not create one person above or below another." He never took a government post. A dark kimono and a dark haori tied with white cords, grey striped hakama, white tabi and geta, and short cropped hair; he holds a book sewn in the Japanese way. He is plain-spoken and independent, and he believes that learning makes a person free.'
