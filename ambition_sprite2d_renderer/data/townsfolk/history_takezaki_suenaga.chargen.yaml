  description: 'A resident of Hakata Bay in 1281, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; Takezaki Suenaga (1246 to after 1314), a minor samurai (a gokenin, a direct vassal of the shogunate) of Higo province in Kyushu. In 1274 the Mongol-Yuan army of Kublai Khan landed at Hakata Bay, and he rode against it with only five followers. When no reward came, he went all the way to Kamakura in 1275 to ask for one; Adachi Yasumori heard his case and gave him the stewardship of Kaitō in Higo. In 1281 the second fleet came, and he fought again and boarded an enemy ship. About 1293 he paid for a pair of illustrated handscrolls of his own deeds, the Mōko Shūrai Ekotoba ("Illustrated Account of the Mongol Invasions"), and they are the best picture of the invasions that we have. O-yoroi armour laced in dark blue silk with white edges and red cross knots: a cuirass with a stencilled leather front, great shoulder boards, a laced skirt and shin guards over red hakama, and fur boots; a soft black cap with a white headband, a tachi in its scabbard at his left hip, and a handscroll, rolled and tied, in his hand. He is proud of what he did, and he wants it written down.'
