  description: 'A resident of Sannai-Maruyama, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; an original Jomon potter of Sannai-Maruyama in north Japan, about 3000 BCE. The Jomon people made some of the oldest pottery on Earth, from about 14,500 BCE, and they made it without farming: they lived from the forest and the sea, and at Sannai-Maruyama a town of pit houses stood for some 1,500 years among tended groves of chestnut. In the Middle Jomon, the potters of the Shinano river country to the south-west built pots whose rims rise in great crests like flames; jade from that country travelled north along the coast to Sannai-Maruyama, and so did ideas. A tunic woven of bark fibre, a comb of red lacquer in her hair, bangles of white shell, and a tall flame-style pot with cord-marked sides on her palm. She is proud of her pots, and warm to everyone who admires them.'
