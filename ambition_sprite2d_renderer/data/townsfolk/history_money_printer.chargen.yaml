  description: 'A resident of Hangzhou, on the floor of East Asia in the History dimension (gate address DYNASTIC). Generated by chargen; an original printer of the state''s paper money at Hangzhou, about 1200 CE. Merchants of Sichuan had used paper notes of deposit (jiaozi) since about 1000, because the iron coins of their province were too heavy to carry; in 1023 the Song state took the printing over, and so issued the first paper money printed by a government. In 1160 the Southern Song began its own notes, the huizi, printed from bronze plates on paper made from mulberry bark, with a border of pictures, a printed text and several red seals so that they were hard to forge. The state printed more and more of them to pay for its wars, and their value fell: the first long lesson in inflation. A plain dark blue work robe tied short over trousers, an apron stained with ink, a bronze printing plate in one hand and a fresh note, with its printed border and its red seal, in the other. He is proud of his work, and wry about how much of it there is.'
