  description: 'A resident of Warrane (Sydney Cove) in 1788, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; Barangaroo (died about 1791), a Cammeraygal woman of the north shore of the harbour, and the wife of Bennelong. She was a fisherwoman. Eora women fished from bark canoes (nawi) with lines of bark fibre and hooks cut from the turban shell, and they kept a small fire burning on a pad of clay in the canoe. She refused European clothes, and she was angry when the colonists took great hauls of fish from the harbour. A part of the Sydney waterfront now has her name. A cloak of possum skins sewn together, one hide from the shoulder to the knee, worn over the left shoulder and under the right arm, so the right arm is free; bare feet and dark curly hair; in her hand a fishing line of fibre wound on a short stick, with a hook of pale shell. She is proud and direct.'
