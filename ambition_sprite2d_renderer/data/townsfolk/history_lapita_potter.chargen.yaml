  description: 'A resident of the Lapita voyagers, the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original potter of the Lapita people, who sailed out of the Bismarck islands around 1,500 BCE, past the last island in sight and on into the open Pacific: Vanuatu, Fiji, Tonga and Samoa. A wrap of tapa (bark cloth) printed with brown bands; a toothed stamp in one hand and a pot stamped all over with its fine patterns in the other, the marks filled with white lime. Her patterns turn up on pot sherds on islands a thousand miles apart, and she is proud of every one.'
