  description: 'A resident of Nauru, between about 1920 and 1968, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; Hammer DeRoburt (1922 to 1992), the head chief of Nauru, who led it to independence. In the Second World War the Japanese occupiers sent him, with many other Nauruans, to Chuuk (Truk). He led the fight of his people to take control of the phosphate that was mined from their island, and to have the land that was mined before independence made good. Nauru became independent on 31 January 1968, and he was its first president. In 1970 the Nauru Phosphate Corporation took the industry over. In 1989 Nauru took Australia to the International Court of Justice over the mined land, and Australia settled in 1993. A white short-sleeved shirt with an open collar, khaki trousers, dark shoes, glasses with thin dark frames and short dark hair; a plain card folder of papers in his hand. He is courteous, patient and unbending.'
