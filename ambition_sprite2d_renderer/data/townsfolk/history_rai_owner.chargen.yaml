  description: 'A resident of Yap, between about 1500 and 1900, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Yapese man of about 1800 who owns rai, the stone money of Yap. The value of a rai comes from its size, from its workmanship and from its history: who quarried it, and how many people died to bring it from Palau. When a rai changes owner, it often stays where it stands, and everyone knows whose it is. A thu (a loincloth of hibiscus fibre, in bands of pale natural fibre and a dyed colour), a bare chest, his dark hair tied up with a plain wooden comb in it, and bare feet; a small woven basket of coconut-leaf plait for betel nut hangs from his arm. He is unhurried and sure.'
