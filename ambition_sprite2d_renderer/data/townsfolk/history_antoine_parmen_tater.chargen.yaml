  description: 'A resident of the Andean highlands, the Americas floor of the History dimension (gate address DYNASTIC). Generated by chargen; a parody of Antoine-Augustin Parmentier (1737-1813), the French army pharmacist who ate potatoes as a prisoner of war in Prussia, and then spent years telling France to eat them too. In the 1770s and 1780s he wrote about them, gave dinners where every dish was potato, gave potato flowers to the king and the queen to wear, and (the story says) put guards on his potato field by day only, so that people came to steal the potatoes at night. A powdered grey wig with a black bow, a blue frock coat, a lace jabot, and a little bouquet of purple potato flowers in his buttonhole; he holds up a potato like a jewel. He is delighted with himself, and nobody has yet told him that the people of the Andes farmed the potato thousands of years before he was born.'
