  description: 'A resident of Taiwan, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; an original woman of eastern Taiwan, about 2500 BCE, who works the green nephrite of Fengtian, near Hualien. Taiwan is the homeland of the Austronesian languages, and its people worked this jade for thousands of years: first into adzes, chisels and beads, and later into ear ornaments that crossed the sea to the Philippines, Borneo and Vietnam. Nephrite is too tough to chip, so it is sawn with a cord and wet sand, then ground and polished for days. A woven wrap of plant fibre with red and black stripes, a necklace of jade beads, an adze with a polished jade blade in one hand and a cord saw in the other. She is precise: one wrong cut can spoil a stone that took a month to saw.'
