  description: 'A resident of Angkor, the Southeast Asia floor of the History dimension (gate address DYNASTIC). Generated by chargen; a parody of Zhou Daguan, a Chinese envoy of the Yuan dynasty who came to Angkor with an embassy of Temür Khan in 1296 and stayed about a year. His book, A Record of Cambodia, is the only account of daily life at Angkor by a person who saw it: the golden towers of the city, the markets kept by women, the baths in the river, the festivals, the houses and the fish of the great lake. Here he is the first guide of Angkor, and he will not stop: he has a pennant on a stick held up high so that his group can find him, a notebook and a brush for every detail, a blue scholar''s robe, a little black hat, and a sunburn. Please stay together; he has a lot to show you.'
