  description: 'A resident of the Red River delta, the Southeast Asia floor of the History dimension (gate address DYNASTIC). Generated by chargen; Trưng Trắc, a noblewoman of northern Vietnam, the elder of the Trưng sisters. In 40 CE she and her sister Trưng Nhị led a rising of the Lạc lords and the people of the delta against the rule of the Han empire; they took back sixty-five citadels, and Trưng Trắc ruled as queen from Mê Linh for three years, until a great Han army came south in 43 CE. The sisters are honoured in Vietnam to this day, with temples, streets and a festival. A long dark red tunic over trousers, a belt with gold, her hair in a knot under a headband of red and gold, and a sword held point-down. She is dignified and resolute.'
