  description: 'A resident of Aotearoa in about 1400, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Māori hunter of about 1350, of the first generations of people in Aotearoa. Their ancestors came from East Polynesia by waka (canoes) in about 1300. The moa were nine kinds of large birds that could not fly; the largest stood up to 3.6 m tall with the neck up. Until people came, the moa had no enemy but Haast''s eagle. In about 150 years all of the moa were gone, and Haast''s eagle with them. A rain cape of flax strips over his shoulders, a flax wrap at the waist, his hair in a topknot and bare feet; a long wooden spear with a point of bone, held upright at rest. He is steady and watchful.'
