  description: 'A resident of Edo, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; Katsushika Ōi (about 1800 to after 1857), painter, the third daughter of Katsushika Hokusai. She worked beside her father for most of his life and cared for him until his death in 1849, and some of the late work signed by him may be hers. Hokusai said that in painting women she was better than he was. Her own paintings use light and shadow in a way that is rare in Edo art: in her night scene of the Yoshiwara, the street and the people are lit only by lanterns. She married a painter, laughed at his work, and left him. A plain brown kimono of striped cotton with a dark obi, her hair in a simple bun with no ornaments, and wooden geta; she holds a painting brush and a sheet with a quick sketch of a lantern. She is blunt, and she cares more for painting than for anything else.'
