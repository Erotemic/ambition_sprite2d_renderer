  description: 'A resident of Calcutta, on the floor of South Asia in the History dimension (gate address DYNASTIC). Generated by chargen; Raja Ram Mohan Roy (1772 to 1833), reformer, writer and publisher of Calcutta. He campaigned for years against sati, the burning of a widow on her husband''s funeral pyre, until the Bengal Regulation of 1829 abolished it. He argued that Indians should be taught modern, scientific subjects such as mathematics, chemistry and anatomy, and he published newspapers, among them Sambad Kaumudi in Bengali (1821) and Mirat-ul-Akhbar in Persian (1822). When a press rule of 1823 made every newspaper get a government licence, he protested against it as an attack on the freedom of the press, and he closed Mirat-ul-Akhbar rather than accept it. In 1830 he sailed to England as the envoy of the Mughal emperor Akbar II, who gave him the title Raja; he died in Bristol in 1833. A long dark choga over white, a white turban as in his portraits, a cream shawl with a dark red border, a newspaper in one hand and a quill in the other. He is thoughtful and determined, and he answers an argument with a better one.'
