  description: 'A resident of Guåhan (Guam) in the Marianas, between about 1000 and 1670, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; Hurao (lived in the 17th century), a Chamorro (CHamoru) chief of Guåhan. In 1668 the Spanish set up a mission at Hagåtña. In 1671 Hurao spoke to the Chamorro against the Spanish, and he led the rising and the siege of the Spanish post at Hagåtña. His speech is known from the history of the Marianas that the French Jesuit Charles Le Gobien published in 1700. The year 1671 is just after the time of this room. He is drawn as an older man: a loincloth of woven pandanus, a plain disc of shell on a cord at his neck, grey in his hair, which is tied up in a knot, and bare feet. He is grave and dignified, and he speaks with care.'
