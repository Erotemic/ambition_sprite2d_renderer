  description: 'A resident of Heian-kyō, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; Sei Shōnagon (about 966 to after 1017), a lady-in-waiting to the Empress Teishi in the 990s and the author of The Pillow Book. It is a book of notes, lists and short scenes: hateful things, things that make the heart beat faster, things that should be short, a cat given a court rank, and the snow on Mount Kōro. She was quick, proud of her learning in Chinese, and very funny, and her lists are still read for pleasure a thousand years later. Murasaki Shikibu, who served the rival empress, wrote in her diary that Sei Shōnagon was dreadfully conceited. A court robe in layers of red, orange and white, the layers shown at the collar and the hem, very long black hair loose down her back, and an open fan of thin cypress slats with long silk cords. She is quick, and amused by almost everything.'
