  description: 'A resident of the room of Dhaka, 1905 to 1971, on the floor of South Asia in the History dimension (gate address DYNASTIC). Generated by chargen; Rabindranath Tagore (1861 to 1941), poet, composer and painter of Bengal. He lived in Calcutta and at Santiniketan, not in Dhaka, but in the 1890s he looked after his family''s estates in East Bengal, at Shilaidaha, and wrote much of his work there. He wrote more than two thousand songs. In 1905 he wrote songs against the partition of Bengal, among them "Amar Shonar Bangla", which became the national anthem of Bangladesh; he also wrote "Jana Gana Mana", the national anthem of India. In 1913 he won the Nobel Prize in Literature for Gitanjali: the first writer from outside Europe to win it, and the first Nobel laureate from Asia. He founded a school at Santiniketan in 1901 and Visva-Bharati University there in 1921. He was knighted in 1915, and in 1919 he gave the knighthood up in protest at the Jallianwala Bagh massacre. In his sixties he began to paint. A long robe (jobba) of dark brown to the ankle, long white hair and a long white beard, a cloth-bound book in one hand and a fountain pen in the other. He is gentle and wise, and a little mischievous.'
