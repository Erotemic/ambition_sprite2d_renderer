  description: Coulomba Tesseract is Nikobolt Tesseract's wife, a pigeon-headed resident of the Science dimension. She
    is an invented character, not a person. Her name joins Columba (the genus of pigeons) and the coulomb (the unit of
    electric charge). Her white pigeon nods to Nikola Tesla's well-known fondness for a white pigeon. The overlay art
    draws her head and her beak in each mouth shape. She is also a gentle parody of Charles-Augustin de Coulomb, who
    measured the force between charges. Her side curls are the rolls of his powdered wig, and a gold plus sign (a
    positive charge) is on her brooch, her buckle and her bolero. Nikobolt carries the minus sign; opposite charges
    attract.
