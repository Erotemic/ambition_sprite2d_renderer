  description: 'A resident of the strait of Srivijaya, the Southeast Asia floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Malay harbour master of Palembang, the capital of Srivijaya, about 680 CE. From its river port on Sumatra, Srivijaya ruled the Strait of Malacca, the sea road between China and India, for six hundred years: ships of every nation had to call at its harbours, pay their dues and trade there. Gold, pepper, camphor, sandalwood and silk passed through his hands. A wrap of checked cotton and a red sash, a gold band on his arm, a small balance for weighing gold and pepper in one hand and a tally of palm leaves in the other. He welcomes every ship, and he knows to the grain what it owes.'
