  description: 'A resident of Calcutta, on the floor of South Asia in the History dimension (gate address DYNASTIC). Generated by chargen; Rani Lakshmibai of Jhansi (about 1828 to 1858), queen of Jhansi and a leader of the rising of 1857. After her husband, the raja Gangadhar Rao, died in 1853, the East India Company used its "doctrine of lapse" to refuse their adopted son, Damodar Rao, as his heir, and it annexed Jhansi in 1854. In the rising of 1857 to 1858 she led the defence of Jhansi when British forces besieged it in 1858; she escaped and fought on, and she died in battle near Gwalior in June 1858. A riding outfit as in her portraits: a fitted red tunic, white trousers and riding boots, a cream turban with a gold band, a gold sash, a sword in its scabbard at her hip with her hand by its hilt, and a brass spyglass. She is resolute and calm.'
