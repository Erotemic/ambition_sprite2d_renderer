  description: 'A resident of the room of Dhaka, 1905 to 1971, on the floor of South Asia in the History dimension (gate address DYNASTIC). Generated by chargen; an original student of Dhaka University in February 1952, in the Language Movement. More than half of the people of Pakistan spoke Bengali, but its leaders wanted Urdu alone as the state language. On 21 February 1952 students of Dhaka University broke a ban on meetings to march for Bengali as a state language. The police opened fire near Dhaka Medical College, and students and others were killed, among them Abul Barkat, Rafiquddin Ahmed and Abdul Jabbar; the Shaheed Minar, the martyrs'' monument in Dhaka, remembers them. Bengali became a state language of Pakistan in 1956, and in 1999 UNESCO declared 21 February International Mother Language Day. A white kurta and pyjama, a dark woollen shawl round his shoulders against the cool of February, a placard painted by hand on a bamboo stick, and a book. He is earnest and brave.'
