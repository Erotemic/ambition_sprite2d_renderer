  description: 'A resident of Rio de Janeiro in May 1888, on the floor of South America in the History dimension (gate address DYNASTIC). Generated by chargen; Francisco José do Nascimento (1839 to 1914), the jangadeiro called the Dragon of the Sea (Dragão do Mar). He was born in Aracati, in Ceará, and he worked on the sea at Fortaleza. The jangadeiros sailed jangadas, rafts of light logs with a triangular sail, and they carried people and goods from the beach out to the ships. In 1881 they refused to carry enslaved people out to the ships that would take them south to be sold. The first strike, in January, was led with José Luís Napoleão, a freedman; Nascimento led the strike of August. Their word was: "In the port of Ceará no more slaves are shipped." Ceará ended slavery on 25 March 1884, four years before the Golden Law, and that year Nascimento and his jangada were celebrated in Rio de Janeiro. A wide straw hat, a white shirt and white trousers rolled to the calf, bare feet, and a coil of rope over his hand. He is proud and weathered by the sea, and he laughs easily.'
