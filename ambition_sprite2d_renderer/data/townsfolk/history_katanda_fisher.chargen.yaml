  description: 'A resident of Ishango, on the Semliki river at Lake Edward, about 20,000 years ago, on the Africa floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original fisher of the Semliki river. At Katanda, down the river from Ishango, archaeologists found barbed harpoon points of bone about 90,000 years old: some of the oldest known. The people of Ishango also fished with barbed harpoons of bone, and they ate a lot of catfish from the river. A short wrap of hide at the waist and bare feet; a long wooden shaft with a barbed point of bone lashed to its tip, held upright at rest, and a string of catfish at his hip. He is patient and quiet, as a fisher must be.'
