  description: 'A resident of Sulawesi, the Southeast Asia floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original woman of the limestone hills of Maros-Pangkep, in Sulawesi, about 51,000 years ago. On the walls of the caves here are the oldest known painted story: a warty pig and three small human-like figures beside it, at least 51,200 years old (Leang Karampuang), and a life-size warty pig at least 45,500 years old (Leang Tedongnge), in red ochre, with the stencils of hands. To make a stencil, a painter put a hand on the rock and blew wet ochre round it through a hollow tube, so the hand stays as bare rock in a cloud of red. Her people had crossed the sea to get here, on the long way to Sahul. A simple wrap of bark cloth and bare feet; red ochre on her hands and forearms, a lump of red ochre in one hand and a hollow bone tube for blowing paint in the other. She is calm and sure, and she paints the pig from memory, every wart in its place.'
