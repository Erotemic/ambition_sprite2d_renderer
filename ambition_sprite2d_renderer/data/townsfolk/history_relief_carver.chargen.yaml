  description: 'A resident of Borobudur, the Southeast Asia floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original stone carver of central Java, about 800 CE, under the Sailendra kings. Borobudur is built of about two million blocks of andesite, a grey volcanic stone, laid over a hill without mortar. Its galleries hold 1,460 panels carved in relief, one of the greatest sets of reliefs in the world: ships with outriggers, markets, houses, musicians, farmers and their animals, all of daily life in Java twelve hundred years ago. A hip wrap and a sash, grey stone dust on his arms, a wooden mallet and an iron chisel. He is patient, and he is proud of every panel.'
