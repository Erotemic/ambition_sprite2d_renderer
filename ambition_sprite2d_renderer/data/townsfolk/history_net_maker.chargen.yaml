  description: 'A resident of Caral, the Americas floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original woman of Aspero, the fishing town at the mouth of the Supe river, about 2600 BCE. The farmers of the valley grew cotton, and the people of the coast made it into fishing nets, with floats of dried gourds; with those nets they caught anchovies and sardines in great numbers, and they traded the dried fish up the valley for cotton, squash and beans. Neither the city nor the coast could live well without the other. A cotton tunic, a cotton net folded over one arm with its gourd floats, and a basket of small silver anchovies in her other hand. She is brisk and funny, and she will tell you that Caral was built on her anchovies.'
