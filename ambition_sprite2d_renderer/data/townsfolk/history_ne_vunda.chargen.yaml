  description: 'A resident of Mbanza Kongo in about 1526, on the Africa floor of the History dimension (gate address DYNASTIC). Generated by chargen; Antonio Manuel ne Vunda (died 1608), a nobleman of Kongo. He did not live in 1526: King Álvaro II sent him as his ambassador to Pope Paul V some eighty years later. He left Kongo in 1604, and his voyage took almost four years: Dutch ships attacked his ship on the way, and he waited a long time in Lisbon and in Spain. He reached Rome at the start of January 1608, sick, and he died there a few days later. Rome remembered him with a portrait bust and a painting. He wears the court dress of a Kongo nobleman of his time, partly of Kongo and partly in the Portuguese style: a long dark mantle with a patterned border over a doublet, a wrap of patterned raffia cloth and a raffia cap (mpu); he holds the rolled letter of his king. He is courteous and patient, and very far from home.'
