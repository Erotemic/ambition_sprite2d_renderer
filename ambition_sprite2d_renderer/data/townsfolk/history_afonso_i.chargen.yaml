  description: 'A resident of Mbanza Kongo in about 1526, on the Africa floor of the History dimension (gate address DYNASTIC). Generated by chargen; Afonso I, Mvemba a Nzinga (about 1456 to 1542 or 1543), king of Kongo from 1509 to 1542. He learned to read and write Portuguese, he sent young nobles of Kongo to study in Lisbon, his son Henrique among them, and he wrote many letters to the kings of Portugal. In 1526 he wrote to King João III that Portuguese traders took his people every day, free people and nobles too, and he asked him to stop the trade. It was not stopped. No portrait of him exists; he is drawn as a king of Kongo of the 1520s might look: a long wrap of fine raffia cloth with a woven pattern of interlaced diamonds, a short cape over his shoulders, the mpu (a cap of fine knotted raffia), bracelets and anklets of copper, an armlet of ivory and sandals; in one hand a fly whisk of animal hair, a sign of rank, and in the other a folded letter. He is old, grave and dignified.'
