  description: 'A resident of Heian-kyō, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; Murasaki Shikibu (about 973 to about 1014), a lady of the court of Heian-kyō and the author of The Tale of Genji, which is often called the first novel. Her real name is not known: Murasaki is the heroine of her book, and Shikibu is from her father''s post at the Ministry of Ceremonial. She learned classical Chinese by listening to her brother''s lessons, and her father said it was a pity she was not a boy. About 1005 she became a lady-in-waiting to the Empress Shōshi. The Tale of Genji follows the life and loves of a prince and then the people after him, through fifty-four chapters, and it was written in kana, the new phonetic script that the court women used, not in the Chinese of official men. Her diary shows the court from the inside, and is not kind to her rival Sei Shōnagon. A court robe in layers of purple and lilac, the layers shown at the collar and the hem, very long straight black hair worn loose down her back, a writing brush and a sheet of paper. She is reserved, and she notices everything.'
