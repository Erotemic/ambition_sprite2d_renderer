  description: 'A resident of the Red River delta, the Southeast Asia floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original bronze-smith of the Dong Son culture of northern Vietnam, about 100 BCE. The smiths of Dong Son cast great bronze drums in moulds of clay: on the top of each is a star with many rays, with rings of flying birds round it and small frogs on the rim, and on the sides are boats and feathered dancers. Drums like his travelled by trade all over Southeast Asia, as far as the islands of Indonesia. A short wrap and a loincloth, a leather apron, a small bronze drum under one arm and a pair of tongs in the other hand. He is proud of his work, and he will make you listen to it.'
