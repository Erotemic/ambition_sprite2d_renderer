  description: 'A resident of Budj Bim, in Gunditjmara country in south-west Victoria, in the long life of its eel farms (from about 4600 BCE to the 1840s), on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Gunditjmara weaver. The Gunditjmara wove baskets and the long eel traps that they set in the gaps of their stone weirs from the sedges and rushes of the wetlands of Tae Rak (Lake Condah), and the weavers of today still make them. A cloak of possum skins sewn together, worn over the left shoulder and under the right arm, so the right arm is free; bare feet and dark curly hair; in her hand a round basket of plaited sedge, half made, its loose strands standing up from the rim. She is calm and quick, and her hands do not stop.'
