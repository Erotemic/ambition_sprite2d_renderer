  description: 'A resident of the Gold Coast, the Africa floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original guide of today, a Ghanaian woman of about forty-five, who takes visitors through the castle. For more than two hundred years the European trading companies held forts like this one on the Gold Coast. They traded for gold, and then more and more for people: men, women and children were held in the dark dungeons under the walls until a ship came, and then they went out through a narrow door to the sea, and did not come back. People named it the Door of No Return. Now the castle is a museum and a place of memory, and descendants of the people who went out through the door come back to it, and some walk back in through it. A blouse in a calm print of teal, a long dark skirt, a lanyard with a guide''s badge, and a folder of papers held close at her side. She is calm, warm and grave; she speaks quietly in the dungeons, and she lets the silence stay.'
