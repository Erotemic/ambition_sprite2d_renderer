  description: 'A resident of Ishango, on the Semliki river at Lake Edward, about 20,000 years ago, on the Africa floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original carver of bone of the hunter-fishers who lived at Ishango, where the Semliki river leaves Lake Edward. They were modern people like us: they fished for catfish in the river, hunted along its banks and made barbed harpoon points of bone. In 1950 the Belgian geologist Jean de Heinzelin dug up a small bone tool here: the Ishango bone, the fibula of a baboon with a chip of quartz set in one end and three columns of notches, cut in groups, along its length. It is now in Brussels. Some people think that the notches count, some that they mark the phases of the moon, and some that they only give a good grip. Nobody knows. A wrap of soft hide at the waist and over one shoulder, a string of small shell beads and bare feet; a small bone with rows of notches in one hand and a pointed flake of quartz to cut them in the other. She is calm, and intent on her work.'
