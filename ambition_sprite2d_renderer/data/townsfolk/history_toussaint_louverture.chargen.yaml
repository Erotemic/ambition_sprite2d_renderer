  description: 'A resident of Haiti, the Americas floor of the History dimension (gate address DYNASTIC). Generated by chargen; Toussaint Louverture (about 1743-1803), a real man, drawn here as original art. He was born enslaved on the Breda plantation near Cap-Francais in Saint-Domingue, was freed in the 1770s, and taught himself to read. He joined the rising of 1791, became its greatest general, beat the Spanish and the British armies, and governed the colony; his constitution of 1801 said that no person in it could be a slave. In 1802 the army of Leclerc took him by a trick and sent him to France, and he died a prisoner in the cold of Fort de Joux in April 1803. When they took him he said that they had cut down only the trunk of the tree of liberty, and that it would grow again from its roots, for they were deep and many. A madras headscarf under a black bicorne with a small red plume, a dark blue general''s coat with gold epaulettes and gold braid, white breeches and tall black boots; a sheathed sword in one hand and a small book in the other. He is calm and watchful, and he listens more than he talks.'
