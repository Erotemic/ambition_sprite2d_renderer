  description: 'A resident of Palmares, on the Serra da Barriga in Alagoas, on the floor of South America in the History dimension (gate address DYNASTIC). Generated by chargen; Dandara of Palmares (died 1694), as tradition remembers her: few written records of her survive, and most of what is told comes from memory kept by the people. Tradition says that she was the companion of Zumbi and the mother of three children; that she farmed and fought in the defence of Palmares; and that she opposed the treaty of 1678 that Ganga Zumba made with the governor of Pernambuco, which freed only those born in Palmares. Tradition says she chose death over capture when Palmares fell in 1694. In 2019 her name was entered in the Book of Heroes and Heroines of the Fatherland (Livro dos Heróis e Heroínas da Pátria). No portrait of her exists; she is drawn as a woman of Palmares about 1680 might look: an ankle-length wrap dress with a dark red sash and border, a green head wrap with a yellow stripe, and a hoe held upright at her side, back from the fields. She is determined and direct.'
