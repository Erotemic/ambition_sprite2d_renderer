  description: 'A resident of Angkor, the Southeast Asia floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Khmer engineer of Angkor, about 1150 CE, at the end of the reign of Suryavarman II, the king who built Angkor Wat. Angkor was the largest city by area of the world before the age of industry, and water made it: the West Baray, a reservoir eight kilometres long and two wide, held the rains of the monsoon, and canals, dikes and moats carried the water across a plain of rice fields. She plans the reservoirs: where the dike goes, how high, and how much it must hold. A sampot of patterned silk wrapped round the hips, a breast cloth, her hair in a knot with a gold pin, a measuring rod in one hand and a rolled plan on palm leaf in the other. She is precise, and her jokes are as dry as the reservoirs are not.'
