  description: 'A resident of Lake Mungo, in the Willandra Lakes, about 40,000 years ago, on the Oceania floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original fisher of the Willandra Lakes. At that time the lakes were full of fresh water. Her people caught golden perch and Murray cod, gathered freshwater mussels and yabbies, and cooked them in hearths on the lake shore; the shells and the fish bones of those meals are still in the dunes. The lakes dried out after about 18,000 years ago. A cloak of possum skins sewn together, one hide from the shoulder to the knee, worn over the left shoulder and under the right arm, so the right arm is free; a plain band in her hair and bare feet; a net bag of looped string with fish and yabbies in it in her hand. She is calm and capable.'
