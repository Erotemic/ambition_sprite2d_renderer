  description: 'A resident of the Congo river in 1904, on the Africa floor of the History dimension (gate address DYNASTIC). Generated by chargen; an original Congolese man of 1904. The Congo Free State (1885 to 1908) was the private property of King Leopold II, and each village had to bring in a quota of wild rubber. Men went far into the forest for days at a time to cut the rubber vines and collect their sap, and the soldiers of the Free State enforced the quota with terror. A plain cloth wrapped at his waist, bare feet and short hair; he carries by its strap an empty tall basket of split cane, of the kind that carried the rubber. He is tired, and he is dignified.'
