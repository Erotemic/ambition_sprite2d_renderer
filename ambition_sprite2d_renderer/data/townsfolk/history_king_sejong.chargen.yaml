  description: 'A resident of Hanyang, on the floor of East Asia''s coasts in the History dimension (gate address DYNASTIC). Generated by chargen; King Sejong the Great (1397 to 1450), the fourth king of Joseon, who ruled from 1418. In 1443 he made a new alphabet for Korean, and in 1446 he published it as the Hunminjeongeum, "the correct sounds for the instruction of the people": until then Koreans wrote in Chinese characters, which took years to learn, so most people could not read. Its letters show the shapes of the mouth and tongue that make each sound, and, as the afterword of his scholars says, a wise man can learn it in a morning and a slow one in ten days. Today it is called Hangul. He gathered scholars in the Hall of Worthies, set up a royal observatory, paid for the water clocks of Jang Yeong-sil, sent rain gauges to every province, and wrote a farming handbook from the reports of farmers across the country. A red royal robe with a gold dragon roundel on the chest, a black winged cap (ikseongwan), a jade belt, and a bound book in his hand. He is kind, deliberate, and patient with questions.'
