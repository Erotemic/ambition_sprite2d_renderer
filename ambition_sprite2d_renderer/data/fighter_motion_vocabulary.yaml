schema_version: 1
name: fighter_motion_vocabulary
policy:
  intent: Canonical long-term fighter animation vocabulary. Full variation coverage is aspirational; current characters
    must cover each applicable baseline_slot.
  variation_rule: Several motions may share one baseline_slot until art quality and gameplay justify bespoke variants.
  capability_rule: fighter_core applies to every full fighter; generic_item applies to fighters using the dynamic
    held-item system; specialized item/status scopes apply only when those systems are supported.
  source_note: The ordered motion labels were supplied by the Ambition author on 2026-08-10.
  category_rule: Current fighter art must cover each applicable category. future_slot preserves the finer animation
    slot so later variants can split without renaming the catalog.
